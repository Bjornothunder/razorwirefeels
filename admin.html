
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Razor Wire Feels — North Carolina Incarcerated Archive</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for JSX in Browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0D0D0D; color: #F3F4F6; }
    .font-mono { font-family: 'Courier Prime', monospace; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    function App() {
      const [searchTerm, setSearchTerm] = React.useState('');
      const [selectedFacility, setSelectedFacility] = React.useState('All');

      const creators = [
        {
          id: 'NC-1369313',
          name: 'Nicolas Losito',
          alias: 'Redbeard the Great',
          facility: 'Central Prison · Raleigh, NC',
          category: 'Memoir & Audio Dispatches',
          worksCount: '52 Episodes · Founder Archive',
          tier: 'Founder / Archival',
          snippet: '"Written and recorded from the hole. Uncensored, unbroken, and preserved forever."'
        },
        {
          id: 'NC-1489201',
          name: 'Marcus V.',
          alias: 'Scribe of Maury',
          facility: 'Maury Correctional · Hookerton, NC',
          category: 'Poetry & Essays',
          worksCount: '8 Handwritten Manuscripts',
          tier: 'Indigent (Free Page)',
          snippet: '"Reflective essays on survival, redemption, and rebuilding a life beyond the wire."'
        },
        {
          id: 'NC-1502394',
          name: 'Darius K.',
          alias: 'K-Master K',
          facility: 'Scotland CI · Laurinburg, NC',
          category: 'Visual Art & Ink Sketches',
          worksCount: '12 Scanned Drawings',
          tier: 'Family Sponsored ($10/mo)',
          snippet: '"High-concept ink drawings and graphic story panels created in segregation."'
        },
        {
          id: 'NC-1610422',
          name: 'Tyrell W.',
          alias: 'Poet of Pasquotank',
          facility: 'Pasquotank CI · Elizabeth City, NC',
          category: 'Poetry & Spoken Word',
          worksCount: '14 Poems',
          tier: 'Indigent (Free Page)',
          snippet: '"Rhymes and reflections written on prison-issued stationery during lockdown."'
        }
      ];

      const facilities = [
        'All',
        'Central Prison · Raleigh, NC',
        'Maury Correctional · Hookerton, NC',
        'Scotland CI · Laurinburg, NC',
        'Pasquotank CI · Elizabeth City, NC'
      ];

      const filtered = creators.filter(c => {
        const matchesSearch = c.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                              c.alias.toLowerCase().includes(searchTerm.toLowerCase()) ||
                              c.id.toLowerCase().includes(searchTerm.toLowerCase());
        const matchesFacility = selectedFacility === 'All' || c.facility === selectedFacility;
        return matchesSearch && matchesFacility;
      });

      return (
        <div className="min-h-screen flex flex-col justify-between selection:bg-[#DC2626] selection:text-white">
          
          {/* HEADER / NAVIGATION */}
          <header className="sticky top-0 z-50 bg-[#121212]/95 border-b border-zinc-800 px-4 py-3 backdrop-blur">
            <div className="max-w-6xl mx-auto flex justify-between items-center">
              <div className="flex items-center gap-2">
                <div className="w-8 h-8 bg-[#DC2626] font-mono font-bold text-black flex items-center justify-center rounded">RWF</div>
                <div>
                  <span className="font-mono font-bold text-base tracking-wider text-white block leading-none">RAZOR WIRE FEELS</span>
                  <span className="text-[10px] text-[#DC2626] font-mono tracking-widest uppercase">NORTH CAROLINA INCARCERATED ARCHIVE</span>
                </div>
              </div>
              <div className="flex items-center gap-3">
                <a href="#mail-intake" className="text-xs font-mono text-gray-300 hover:text-white hidden sm:block">
                  Mail Ingestion
                </a>
                <a href="#support" className="bg-[#DC2626] hover:bg-red-700 text-white font-bold text-xs font-mono uppercase px-3.5 py-1.5 rounded tracking-wider transition-all">
                  Sponsor ($10/mo)
                </a>
              </div>
            </div>
          </header>

          {/* HERO SECTION */}
          <section className="px-6 py-12 text-center bg-gradient-to-b from-[#141414] to-[#0D0D0D] border-b border-zinc-800">
            <div className="max-w-3xl mx-auto space-y-4">
              <span className="text-xs font-mono text-red-400 border border-red-900/60 bg-red-950/40 px-3.5 py-1 rounded-full inline-block">
                PHYSICAL MAIL INTAKE · AI OCR TRANSCRIBED · 60+ NC FACILITIES
              </span>
              <h1 className="text-3xl md:text-5xl font-black font-mono uppercase tracking-tight">
                32,000 PEOPLE. <span className="text-[#DC2626]">ONE VOICE EACH.</span>
              </h1>
              <p className="text-sm md:text-base text-gray-300 font-light leading-relaxed">
                Preserving and amplifying the memoirs, poetry, and artwork of incarcerated North Carolinians. Written on paper, scanned to the web, preserved forever.
              </p>
            </div>
          </section>

          {/* PODCAST HIGHLIGHT BANNER */}
          <section id="podcast" className="bg-black/80 border-b border-zinc-800 py-6 px-4">
            <div className="max-w-4xl mx-auto bg-[#141414] border border-zinc-800 p-4 sm:p-6 rounded flex flex-col sm:flex-row items-center gap-5">
              <div className="w-16 h-16 sm:w-20 sm:h-20 bg-[#DC2626] text-black font-mono font-black flex-shrink-0 flex items-center justify-center text-center text-xs p-2 rounded">
                PODCAST WEEKLY
              </div>
              <div className="space-y-1 text-center sm:text-left flex-1">
                <div className="text-[10px] font-mono text-[#DC2626] uppercase tracking-widest">DISPATCHES FROM THE BLACK HOLE</div>
                <h3 className="font-bold text-base font-mono text-white">Hosted by Nicolas "Redbeard the Great" Losito</h3>
                <p className="text-xs text-gray-400 font-mono">
                  Weekly audio readings of handwritten letters sent to our NC PO Box. Real voices, authentic stories, live on Spotify, Apple, & YouTube.
                </p>
              </div>
              <a href="#podcast" className="bg-zinc-800 hover:bg-zinc-700 text-white text-xs font-mono font-bold px-4 py-2 rounded border border-zinc-700 text-center flex-shrink-0">
                Listen Now →
              </a>
            </div>
          </section>

          {/* CREATOR DIRECTORY */}
          <main className="max-w-6xl mx-auto px-4 py-8 space-y-6 w-full">
            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-zinc-800 pb-4">
              <div>
                <h2 className="text-xl font-bold font-mono uppercase">North Carolina Creator Directory</h2>
                <p className="text-xs text-gray-400 font-mono mt-0.5">Explore authentic handwritten portfolios from NC carceral facilities.</p>
              </div>
              <div className="flex flex-col sm:flex-row gap-2 w-full sm:w-auto">
                <select 
                  value={selectedFacility}
                  onChange={e => setSelectedFacility(e.target.value)}
                  className="bg-[#181818] border border-zinc-800 text-xs font-mono rounded px-3 py-1.5 text-gray-300 focus:outline-none focus:border-[#DC2626]"
                >
                  {facilities.map(f => <option key={f} value={f}>{f}</option>)}
                </select>
                <input 
                  type="text" 
                  placeholder="Search name, ID..."
                  value={searchTerm}
                  onChange={e => setSearchTerm(e.target.value)}
                  className="bg-[#181818] border border-zinc-800 text-xs font-mono rounded px-3 py-1.5 text-white w-full sm:w-48 focus:outline-none focus:border-[#DC2626]"
                />
              </div>
            </div>

            <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-4">
              {filtered.map(c => (
                <div key={c.id} className="bg-[#141414] border border-zinc-800 hover:border-[#DC2626] p-5 rounded space-y-3 transition-all flex flex-col justify-between">
                  <div className="space-y-3">
                    <div className="flex justify-between items-center text-xs font-mono">
                      <span className="bg-zinc-800 text-red-400 px-2 py-0.5 rounded">{c.id}</span>
                      <span className="text-gray-500 text-[11px]">{c.tier}</span>
                    </div>
                    <div>
                      <h3 className="font-bold text-lg font-mono text-white">{c.name}</h3>
                      <div className="text-xs text-[#DC2626] font-mono">"{c.alias}"</div>
                      <div className="text-xs text-gray-400 mt-0.5">{c.facility}</div>
                    </div>
                    <p className="text-xs text-gray-300 font-mono italic bg-black/50 p-3 rounded border border-zinc-900 leading-relaxed">
                      {c.snippet}
                    </p>
                  </div>
                  <div className="pt-3 border-t border-zinc-900 flex justify-between items-center text-xs font-mono">
                    <span className="text-gray-500">{c.worksCount}</span>
                    <span className="text-[#DC2626] font-bold hover:underline cursor-pointer">View Scans →</span>
                  </div>
                </div>
              ))}
            </div>
          </main>

          {/* PHYSICAL MAIL INTAKE INSTRUCTIONS */}
          <section id="mail-intake" className="bg-[#121212] border-t border-b border-zinc-800 py-12 px-6">
            <div className="max-w-4xl mx-auto space-y-8">
              <div className="text-center space-y-2">
                <span className="text-xs font-mono text-red-400 uppercase tracking-widest">SUBMISSION PROCESS</span>
                <h2 className="text-2xl font-bold font-mono text-white uppercase">How Incarcerated Writers & Artists Submit Work</h2>
                <p className="text-xs text-gray-400 max-w-xl mx-auto font-mono">
                  We process physical mail sent directly from North Carolina carceral facilities through our dedicated intake hub.
                </p>
              </div>

              <div className="grid md:grid-cols-3 gap-6 font-mono text-xs">
                <div className="bg-[#181818] border border-zinc-800 p-5 rounded space-y-2">
                  <div className="text-[#DC2626] font-bold text-base">01. MAIL MANUSCRIPT</div>
                  <p className="text-gray-300 leading-relaxed">
                    Creators mail original handwritten letters, memoirs, poetry, or artwork along with a signed Contributor Release Form to our NC PO Box.
                  </p>
                </div>
                <div className="bg-[#181818] border border-zinc-800 p-5 rounded space-y-2">
                  <div className="text-[#DC2626] font-bold text-base">02. HIGH-SPEED SCAN & OCR</div>
                  <p className="text-gray-300 leading-relaxed">
                    We batch-scan physical pages using desktop ADF scanners and run AI VLM OCR to transcribe handwriting into clean, searchable web text.
                  </p>
                </div>
                <div className="bg-[#181818] border border-zinc-800 p-5 rounded space-y-2">
                  <div className="text-[#DC2626] font-bold text-base">03. PUBLISH & ESCROW</div>
                  <p className="text-gray-300 leading-relaxed">
                    Work is hosted on razorwirefeels.org and published in quarterly zines. 70% of net sales go into creator support escrow accounts.
                  </p>
                </div>
              </div>

              <div className="bg-black border border-red-900/40 p-6 rounded text-center space-y-3 font-mono">
                <div className="text-xs text-gray-400 uppercase tracking-wider">OFFICIAL NC MAILING ADDRESS & RELEASE FORM</div>
                <div className="text-base font-bold text-white">RWF Publishing LLC · PO Box [Number] · [City], NC [Zip]</div>
                <div className="pt-2">
                  <a href="/contributor-release-agreement-v2.pdf" download className="bg-zinc-800 hover:bg-zinc-700 text-white text-xs font-bold px-4 py-2 rounded border border-zinc-700 inline-block">
                    📄 Download Printable Release Form (PDF)
                  </a>
                </div>
              </div>
            </div>
          </section>

          {/* SPONSOR & ESCROW SECTION */}
          <section id="support" className="bg-[#0D0D0D] py-12 px-6">
            <div className="max-w-4xl mx-auto text-center space-y-6">
              <span className="text-xs font-mono text-red-400 uppercase tracking-widest">EXPOSURE-FIRST FINANCIAL MODEL</span>
              <h2 className="text-2xl font-bold font-mono text-white">SPONSOR A VOICE ($10/MO)</h2>
              <p className="text-xs md:text-sm text-gray-300 max-w-2xl mx-auto leading-relaxed font-mono">
                Outside family members and supporters pay a $10/month subscription to maintain priority manuscript ingestion. Every subscription directly cross-subsidizes free profile pages for indigent creators across North Carolina.
              </p>
              <div className="grid sm:grid-cols-2 gap-4 max-w-xl mx-auto pt-2 font-mono text-xs">
                <div className="bg-[#141414] border border-zinc-800 p-4 rounded text-left space-y-2">
                  <div className="text-[#DC2626] font-bold">$10/Mo Family Supporter</div>
                  <p className="text-gray-400 text-[11px]">Priority scanning, dedicated creator page, audio dispatch highlight, and full archive backup.</p>
                  <button className="w-full bg-[#DC2626] hover:bg-red-700 text-white font-bold py-2 rounded uppercase mt-2">Sponsor Now</button>
                </div>
                <div className="bg-[#141414] border border-zinc-800 p-4 rounded text-left space-y-2">
                  <div className="text-white font-bold">Indigent Inmate Request</div>
                  <p className="text-gray-400 text-[11px]">100% free profile hosting, basic OCR transcription, and inclusion in the Edovo tablet zine.</p>
                  <button className="w-full bg-zinc-800 hover:bg-zinc-700 text-white font-bold py-2 rounded uppercase border border-zinc-700 mt-2">Request Free Page</button>
                </div>
              </div>
            </div>
          </section>

          {/* FOOTER */}
          <footer className="bg-black border-t border-zinc-800 p-6 text-center text-xs text-gray-500 font-mono space-y-2">
            <div>© 2026 RWF Publishing LLC · razorwirefeels.org</div>
            <div>Founded by Nicolas "Redbeard the Great" Losito · ID 1369313</div>
            <div className="text-[10px] text-gray-600 max-w-lg mx-auto pt-2">
              RWF Publishing LLC operates independently of the NCDAC. Section 230 safe harbors apply. All creator earnings managed through NCDAC-compliant Support Escrow Accounts.
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
